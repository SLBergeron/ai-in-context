name: Ep 01 weekly podcast prospecting
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'
permissions:
  contents: read
  actions: read
concurrency:
  group: podcast-prospecting
  cancel-in-progress: false
jobs:
  discover:
    # Public Actions artifacts can contain public contact details and feed data.
    # Local workspace scheduling does not depend on this optional workflow.
    if: vars.ENABLE_PUBLIC_PROSPECTING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ep01-delegating-to-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last successful delivery history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          prior_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ep01-weekly-prospecting.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$prior_run" ]; then
            gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" --name prospect-state --dir .
          fi
      - name: Discover and rank new podcast candidates
        run: python prospect.py
      - name: Retain delivery history
        uses: actions/upload-artifact@v4
        with:
          name: prospect-state
          path: |
            ep01-delegating-to-agents/state/
            ep01-delegating-to-agents/reports/
          if-no-files-found: error
          retention-days: 90
      - name: Deliver prospect reports
        uses: actions/upload-artifact@v4
        with:
          name: podcast-prospects
          path: ep01-delegating-to-agents/reports/
          if-no-files-found: error
          retention-days: 90
