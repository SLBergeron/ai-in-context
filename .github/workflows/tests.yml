name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ep01:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ep01-delegating-to-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -q
